[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-copilot"
version = "0.1.0"
description = "个人求职助手：投得准 + 谈得好 > 投得多"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "playwright>=1.44",
    "openai>=1.40",
    "rich>=13.0",
    "python-dateutil>=2.9",
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
job-copilot = "job_copilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
